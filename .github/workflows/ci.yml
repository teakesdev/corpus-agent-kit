name: Agent Kit CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm pack --workspace mcp-server --dry-run
      - run: node scripts/check-plugin-package.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: python3 scripts/package-openai-plugin.py HEAD
      - run: python3 scripts/package-openai-plugin.py HEAD --output-dir dist/repeat
      - run: cmp dist/corpus-openai-*.zip dist/repeat/corpus-openai-*.zip
      - run: unzip -t dist/corpus-openai-*.zip
