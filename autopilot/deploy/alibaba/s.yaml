# Alibaba Cloud Function Compute (FC 3.0) — custom runtime running the
# Formation Autopilot Node server. This file is the hackathon's required
# proof-of-Alibaba-Cloud code artifact.
edition: 3.0.0
name: corpus-agent-kit
access: default

resources:
  autopilot:
    component: fc3
    props:
      region: us-west-1
      functionName: formation-autopilot
      description: Formation Autopilot (corpus-agent-kit) — Qwen hackathon Track 4
      runtime: custom.debian10
      cpu: 0.35
      memorySize: 512
      diskSize: 512
      timeout: 120
      instanceConcurrency: 10
      # custom.debian10 ships no Node — the official Nodejs20 layer provides it
      # (extracted under /opt; PATH below makes it resolvable).
      layers:
        - acs:fc:us-west-1:official:layers/Nodejs20/versions/3
      customRuntimeConfig:
        command: ["node", "dist/server.js"]
        port: 9000
      environmentVariables:
        PATH: /opt/nodejs20/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin
        QWEN_API_KEY: ${env(QWEN_API_KEY)}
        QWEN_BASE_URL: ${env(QWEN_BASE_URL)}
        QWEN_MODEL_FAST: ${env(QWEN_MODEL_FAST)}
        QWEN_MODEL_CRITICAL: ${env(QWEN_MODEL_CRITICAL)}
        CORPUS_BASE_URL: ${env(CORPUS_BASE_URL)}
        # Without a key the demo shares FC's egress IP against the
        # ANONYMOUS quota (100 searches/month per IP) and law search
        # degrades silently to "citations pending". It is also what
        # makes handoffs attributable — see tools/handoff.ts.
        CORPUS_API_KEY: ${env(CORPUS_API_KEY)}
        # Per-process requests per hour, shared by plan, handoff and chat. Per-IP limits (30/h plan, 60/h handoff) are in
        # src/server.ts and need no setting; PLAN_PER_IP_PER_HOUR / HANDOFF_PER_IP_PER_HOUR override them.
        SPEND_CAP_TURNS_PER_HOUR: "600"
      # Request logs. Without this FC keeps none, so a plan's cost could not be read back (corpus plan review,
      # 2026-11-01). `auto` reuses the account's FC log project or creates it; src/request-log.ts writes one JSON
      # line per /api/plan and /api/plan/handoff request (tool calls, Qwen tokens, status, duration; no activity,
      # city or other free text). Set the logstore's retention to 30 days. See deploy/alibaba/README.md.
      # `auto` created this project and logstore on the 2026-11-07 deploy; pinned so later deploys reuse them.
      logConfig:
        project: serverless-us-west-1-6de9fcef-7437-56d8-9cbe-0163f9c6ff20
        logstore: default-logs
      code: ../..
      triggers:
        - triggerName: http
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: [GET, POST, OPTIONS]
